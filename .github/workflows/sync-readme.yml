name: Sync README Core models

# Three jobs over the two files this repo publishes live:
#   check-updates      — updates.json is something the app can actually show
#   check-core-models  — core-models.json describes tiers that can serve and bill
#   sync               — regenerate the README's Core models table from the JSON
#
# core-models.json is the single source of truth; edit only the JSON.
#
# The two CHECKS run on PULL REQUESTS; the sync cannot, because it rewrites a
# file and can only be applied after a merge. That split is the whole point:
# both JSON files are published the moment they land on main and every installed
# client picks them up within the hour — a malformed updates.json silently shows
# nothing, and a bad core-models.json silently bills at the reserve. Neither
# errors, so both are worth catching before the merge rather than after.

on:
  push:
    branches: [main]
    paths:
      - "core-models.json"
      - "updates.json"
      - "scripts/gen-readme-models.mjs"
      - "scripts/check-updates.mjs"
      - "scripts/pick-core-model.mjs"
      - ".github/workflows/sync-readme.yml"
  pull_request:
    paths:
      - "updates.json"
      - "scripts/check-updates.mjs"
      - "core-models.json"
      - "scripts/pick-core-model.mjs"
  workflow_dispatch:

# Per JOB, not workflow-wide: the validator reads a file and needs nothing, and
# a token with write access sitting on a pull_request run is write access
# granted to whoever opened the pull request.
permissions: {}

# Keyed on the ref. A single global group would mean a pull-request run and an
# in-flight main sync cancel each other, and the one that loses is whichever
# started first — which is the merge that actually needed to finish.
concurrency:
  group: sync-readme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate updates.json
        run: node scripts/check-updates.mjs

  check-core-models:
    # The gate this file was missing. `core-models.json` is read by the proxy on a
    # 10-minute refresh loop, so an edit here goes LIVE to every installed client
    # with no build, no release and no review step — the same reasoning the
    # updates.json check is built on, with more at stake, because the failures are
    # silent: a model id that is absent from models.dev has no price row, so every
    # request on that tier bills at its worst-case RESERVE instead of actual cost,
    # indefinitely, and nothing errors.
    #
    # Needs no secrets. models.dev and OpenRouter's catalogs are public; the
    # script's optional live provider `/models` consult simply skips without keys.
    #
    # If this goes red without a config change, read the log before assuming the
    # JSON is wrong: the audit fetches models.dev, and it fails closed on a
    # sustained outage rather than passing with a warning.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Audit core-models.json
        run: node scripts/pick-core-model.mjs --check

  sync:
    # Only after a merge: this job rewrites README.md and pushes.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate README table from core-models.json
        run: node scripts/gen-readme-models.mjs

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: sync Core models table from core-models.json [skip ci]"
            git push
          else
            echo "README.md already in sync."
          fi
