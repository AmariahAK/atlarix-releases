name: Sync generated tables

# Jobs over the two files this repo publishes live:
#   check-updates      — updates.json is something the app can actually show
#   check-core-models  — core-models.json describes tiers that can serve and bill
#   sync-site-lineup   — regenerate + push atlarix-launchpad's derived lineup
#   sync               — regenerate the generated tables + the README catalogue counts
#
# core-models.json is the single source of truth; edit only the JSON.
#
# The two CHECKS run on PULL REQUESTS; the sync cannot, because it rewrites a
# file and can only be applied after a merge. That split is the whole point:
# both JSON files are published the moment they land on main and every installed
# client picks them up within the hour — a malformed updates.json silently shows
# nothing, and a bad core-models.json silently bills at the reserve. Neither
# errors, so both are worth catching before the merge rather than after.

on:
  push:
    branches: [main]
    paths:
      - "core-models.json"
      - "updates.json"
      - "scripts/gen-readme-models.mjs"
      - "scripts/gen-readme-catalog.mjs"
      - "scripts/check-updates.mjs"
      - "scripts/pick-core-model.mjs"
      - ".github/workflows/sync-readme.yml"
  pull_request:
    paths:
      - "updates.json"
      - "scripts/check-updates.mjs"
      - "core-models.json"
      - "scripts/pick-core-model.mjs"
  # Weekly, because two of these jobs assert on things that move without anyone
  # touching this repo: the models.dev catalogue size in the README, and whether
  # atlarix.dev is still serving the lineup we publish. Both would otherwise only be
  # re-checked when core-models.json happens to change.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Per JOB, not workflow-wide: the validator reads a file and needs nothing, and
# a token with write access sitting on a pull_request run is write access
# granted to whoever opened the pull request.
permissions: {}

# Keyed on the ref. A single global group would mean a pull-request run and an
# in-flight main sync cancel each other, and the one that loses is whichever
# started first — which is the merge that actually needed to finish.
concurrency:
  group: sync-readme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate updates.json
        run: node scripts/check-updates.mjs

  check-core-models:
    # The gate this file was missing. `core-models.json` is read by the proxy on a
    # 10-minute refresh loop, so an edit here goes LIVE to every installed client
    # with no build, no release and no review step — the same reasoning the
    # updates.json check is built on, with more at stake, because the failures are
    # silent: a model id that is absent from models.dev has no price row, so every
    # request on that tier bills at its worst-case RESERVE instead of actual cost,
    # indefinitely, and nothing errors.
    #
    # Needs no secrets. models.dev and OpenRouter's catalogs are public; the
    # script's optional live provider `/models` consult simply skips without keys.
    #
    # If this goes red without a config change, read the log before assuming the
    # JSON is wrong: the audit fetches models.dev, and it fails closed on a
    # sustained outage rather than passing with a warning.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Audit core-models.json
        run: node scripts/pick-core-model.mjs --check

  sync-site-lineup:
    # After a merge, regenerate atlarix-launchpad's derived lineup (the Cloud page's
    # model menu reads it; the site no longer lists models) from the JSON that just landed
    # and push it; the push is what redeploys the site (Vercel's git integration,
    # not Actions — so the launchpad being private costs no Actions minutes).
    #
    # Authenticates with a DEPLOY KEY scoped to atlarix-launchpad alone
    # (secret LAUNCHPAD_DEPLOY_KEY) — write access to one repo, nothing else.
    # Commits only the one generated file, so it cannot push anything else.
    # Without the secret it skips cleanly.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    steps:
      - name: Deploy key present?
        id: key
        env:
          KEY: ${{ secrets.LAUNCHPAD_DEPLOY_KEY }}
        run: |
          if [[ -n "$KEY" ]]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::warning::LAUNCHPAD_DEPLOY_KEY is not set — the site lineup will not auto-sync."; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'
        with:
          repository: AmariahAK/atlarix-launchpad
          ssh-key: ${{ secrets.LAUNCHPAD_DEPLOY_KEY }}
          path: launchpad
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ok == 'true'
        with:
          node-version: "20"
      - name: Regenerate the site's Core lineup and push if it changed
        id: push
        if: steps.key.outputs.ok == 'true'
        working-directory: launchpad
        run: |
          node scripts/gen-core-lineup.mjs
          FILE=src/data/core-lineup.generated.json
          if [[ -n "$(git status --porcelain -- "$FILE")" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "$FILE"
            git commit -m "chore: refresh Core lineup from core-models.json"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Site lineup already in sync."
          fi

  sync:
    # Only after a merge: this job rewrites the generated files and pushes.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate the Core tables from core-models.json
        run: node scripts/gen-readme-models.mjs

      # Fails SOFT by design: an unreachable models.dev leaves the README untouched
      # and exits 0. A docs refresher that can break CI because a third party is down
      # is a docs refresher someone eventually deletes.
      - name: Refresh README catalogue counts from models.dev
        run: node scripts/gen-readme-catalog.mjs

      # Three generated files now, not one: the Core lineup table moved to
      # docs/CORE-MODELS.md, the routing table in docs/CORE-CUTOVER.md is generated
      # too (it was hand-typed and drifted), and README.md still carries the
      # models.dev catalogue counts inline. Naming them explicitly rather than
      # committing everything keeps this job unable to push an unrelated change.
      - name: Commit if changed
        run: |
          FILES=(README.md docs/CORE-MODELS.md docs/CORE-CUTOVER.md)
          if [[ -n "$(git status --porcelain -- "${FILES[@]}")" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${FILES[@]}"
            git commit -m "chore: sync generated tables from core-models.json [skip ci]"
            git push
          else
            echo "Generated tables already in sync."
          fi
